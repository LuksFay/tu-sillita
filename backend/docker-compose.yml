version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tu_sillita_db
    environment:
      POSTGRES_DB: tu_sillita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tu_sillita_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: tu_sillita_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tusillita.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - tu_sillita_network

volumes:
  postgres_data:

networks:
  tu_sillita_network:
    driver: bridge
